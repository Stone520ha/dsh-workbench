name: Infinite Canvas MVP

on:
  push:
    branches:
      - feat/infinite-canvas-mvp
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Typecheck and build plugin package
        run: |
          npm run build
          npm run build:package

      - name: Canvas 250-node scale smoke
        run: npm run test:canvas-scale

      - name: Verify package contracts
        run: npm run test:package

      - name: Pack and install smoke test
        run: npm run verify:install
