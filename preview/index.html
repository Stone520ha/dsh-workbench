<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>DSH Infinite Canvas MVP Preview</title>
<style>
:root{--bg:#f6f7f9;--panel:#fff;--line:#dfe3e8;--text:#1d2329;--muted:#6b7280;--brand:#4f6df5;--brand-soft:#eef1ff;--shadow:0 10px 30px rgba(18,24,40,.10)}
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--text);background:var(--bg);overflow:hidden}button,input,textarea{font:inherit}button{cursor:pointer}
#app{height:100%;display:flex;flex-direction:column}.topbar{height:58px;flex:none;display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.94);backdrop-filter:blur(10px);z-index:50}.brand{font-weight:800;letter-spacing:.2px;margin-right:8px}.brand span{color:var(--brand)}.pill{height:34px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:#303640}.pill.active{background:var(--brand-soft);border-color:#cfd7ff;color:#3346b8;font-weight:700}.spacer{flex:1}.status{font-size:12px;color:var(--muted);padding-right:4px}.workspace{position:relative;flex:1;min-height:0}
#viewport{position:absolute;inset:0;overflow:hidden;touch-action:none;cursor:grab;background-color:#fbfbfc;background-image:radial-gradient(circle at 1px 1px,#d8dde5 1.05px,transparent 1.1px);background-size:24px 24px}#viewport.panning{cursor:grabbing}#world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}#edges{position:absolute;left:-100000px;top:-100000px;width:200000px;height:200000px;overflow:visible;pointer-events:none}
.node{position:absolute;min-width:180px;min-height:82px;border:1px solid rgba(31,41,55,.12);border-radius:14px;background:#fff;box-shadow:0 6px 20px rgba(18,24,40,.08);user-select:none;overflow:hidden}.node.selected{outline:2px solid var(--brand);outline-offset:2px}.node .head{height:30px;padding:6px 9px;border-bottom:1px solid rgba(31,41,55,.08);display:flex;align-items:center;gap:7px;font-size:11px;font-weight:800;letter-spacing:.2px}.node .body{padding:10px 12px;font-size:13px;line-height:1.5;white-space:pre-wrap;word-break:break-word;max-height:220px;overflow:auto}.node .meta{padding:0 12px 10px;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.type-user{background:#eef6ff}.type-agent{background:#f7f5ff}.type-note{background:#fffceb}.type-image{background:#fff}.type-file{background:#eefbf3}.type-web{background:#eef9ff}.type-code{background:#f5f7f9}.type-image img{display:block;width:100%;max-height:240px;object-fit:cover}.type-code .body{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;background:#101318;color:#e8edf3;max-height:260px}
.floating{position:absolute;z-index:45;background:rgba(255,255,255,.95);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);backdrop-filter:blur(8px)}.hud{top:12px;left:12px;padding:8px 10px;font-size:12px;color:#3e4650}.inspector{top:12px;right:12px;width:310px;max-height:calc(100% - 120px);padding:12px;overflow:auto}.inspector h3{margin:0 0 10px;font-size:13px}.inspector label{display:block;font-size:11px;color:var(--muted);margin:10px 0 4px}.inspector input,.inspector textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:8px 9px;background:#fff;color:var(--text)}.inspector textarea{min-height:110px;resize:vertical}.inspector .row{display:flex;gap:8px;margin-top:10px}.inspector .row button{flex:1;height:32px;border:1px solid var(--line);border-radius:8px;background:#fff}
.composer{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);z-index:46;width:min(760px,calc(100% - 40px));display:flex;gap:8px;padding:8px;border:1px solid var(--line);border-radius:15px;background:rgba(255,255,255,.96);box-shadow:0 14px 40px rgba(18,24,40,.14)}.composer input{flex:1;min-width:0;border:0;outline:0;background:transparent;padding:8px}.composer button{border:0;border-radius:10px;padding:0 14px;background:var(--brand);color:#fff;font-weight:800}.composer .hint{display:flex;align-items:center;padding-left:4px;color:var(--muted);font-size:11px;white-space:nowrap}.toast{position:absolute;left:50%;top:16px;transform:translateX(-50%);z-index:80;background:#171a1f;color:#fff;padding:9px 13px;border-radius:10px;font-size:12px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}.legend{position:absolute;left:12px;bottom:18px;z-index:44;font-size:11px;color:var(--muted);background:rgba(255,255,255,.88);border:1px solid var(--line);padding:7px 9px;border-radius:10px}.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 7px;border-radius:999px;background:#f1f3f5;margin-right:4px}.hidden{display:none!important}
</style>
</head>
<body>
<div id="app">
<div class="topbar"><div class="brand">DSH <span>Infinite Canvas</span></div><button class="pill active" data-tool="select">选择</button><button class="pill" data-tool="link">连线</button><button class="pill" id="addNote">+ Note</button><label class="pill" style="display:flex;align-items:center"><input id="imageInput" type="file" accept="image/*" multiple style="display:none">+ 图片</label><button class="pill" id="fitBtn">适配视图</button><button class="pill" id="resetBtn">重置 Demo</button><button class="pill" id="exportBtn">导出 JSON</button><label class="pill" style="display:flex;align-items:center"><input id="importInput" type="file" accept="application/json" style="display:none">导入 JSON</label><div class="spacer"></div><div class="status" id="status">0 nodes · 0 selected</div></div>
<div class="workspace"><div id="viewport"><div id="world"><svg id="edges"></svg><div id="nodes"></div></div><div class="floating hud" id="hud">100%</div><div class="floating inspector hidden" id="inspector"><h3>节点属性</h3><div id="inspectorType" class="badge"></div><label>标题</label><input id="inspectorTitle"><label>内容</label><textarea id="inspectorContent"></textarea><label>URL / Path</label><input id="inspectorRef"><div class="row"><button id="openRefBtn">打开</button><button id="deleteBtn">删除</button></div></div><div class="composer"><div class="hint" id="contextHint">无选择</div><input id="promptInput" placeholder="选择几个节点，然后让 Agent 继续工作…"><button id="askBtn">Ask Agent</button></div><div class="legend">空白处拖动＝平移 · 滚轮＝缩放 · Shift 点击＝多选 · 双击 Note＝编辑 · 连线模式下依次点击两个节点</div><div class="toast" id="toast"></div></div></div>
</div>
<script>
(()=>{const K='dsh-infinite-canvas-preview-v1',$=s=>document.querySelector(s),v=$('#viewport'),w=$('#world'),ne=$('#nodes'),ee=$('#edges'),st=$('#status'),hud=$('#hud'),insp=$('#inspector'),hint=$('#contextHint'),toast=$('#toast');let S=load()||demo(),tool='select',linkSource=null,drag=null,pan=null;const sel=new Set();
function node(id,type,x,y,w,h,title,content,ref=null,img=null){return{id,type,x,y,w,h,title,content,ref,img}}
function demo(){return{camera:{x:130,y:80,zoom:1},nodes:[node('u1','user',80,80,330,120,'产品经理需求','研究 25–35 岁年轻用户的模块化沙发需求，并形成产品定义。'),node('a1','agent',500,90,360,140,'Agent 分析','已拆分为趋势研究、竞品分析、用户痛点、材料与成本四个方向。'),node('w1','web',960,50,360,150,'Dezeen · Modular sofa trends','https://www.dezeen.com/\n近年模块化、低矮、可重组沙发持续增长。','https://www.dezeen.com/'),node('i1','image',960,245,360,245,'灵感图','',null,'https://images.unsplash.com/photo-1555041469-a586c61ea9bc?auto=format&fit=crop&w=900&q=80'),node('f1','file',500,300,340,115,'concept-report.md','Agent 产出文件\n/workspace/research/concept-report.md','/workspace/research/concept-report.md'),node('c1','code',80,285,390,230,'pricing-model.ts','1  export function targetPrice(cost: number) {\n2    const grossMargin = 0.46\n3    return Math.round(cost / (1 - grossMargin))\n4  }\n5\n6  // MVP preview: structured Code Node','/workspace/src/pricing-model.ts'),node('n1','note',80,555,330,125,'设计师 Note','需要验证：靠背高度、坐深、模块拼接缝、猫抓布耐久性。')],edges:[{id:'e1',from:'u1',to:'a1'},{id:'e2',from:'a1',to:'w1'},{id:'e3',from:'a1',to:'f1'},{id:'e4',from:'w1',to:'i1'}]}}
function save(){localStorage.setItem(K,JSON.stringify(S))}function load(){try{return JSON.parse(localStorage.getItem(K))}catch{return null}}function uid(p='n'){return p+Math.random().toString(36).slice(2,9)}function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function icon(t){return({user:'👤',agent:'✦',note:'📝',image:'🖼',file:'📄',web:'🌐',code:'⌘'})[t]||'◻'}function by(id){return S.nodes.find(n=>n.id===id)}
function render(){w.style.transform=`translate(${S.camera.x}px,${S.camera.y}px) scale(${S.camera.zoom})`;ne.innerHTML='';for(const n of S.nodes){const e=document.createElement('div');e.className=`node type-${n.type}${sel.has(n.id)?' selected':''}`;e.dataset.id=n.id;e.style.left=n.x+'px';e.style.top=n.y+'px';e.style.width=n.w+'px';e.style.minHeight=n.h+'px';e.innerHTML=`<div class="head">${icon(n.type)} ${esc(n.title||n.type)}</div>`+(n.type==='image'?`<img src="${n.img||''}" alt="">`:`<div class="body">${esc(n.content||'')}</div>`)+(n.ref?`<div class="meta">${esc(n.ref)}</div>`:'');ne.appendChild(e)}edges();st.textContent=`${S.nodes.length} nodes · ${sel.size} selected`;hud.textContent=`${Math.round(S.camera.zoom*100)}%`;hint.textContent=sel.size?`${sel.size} 个上下文`:'无选择';inspector()}
function edges(){ee.innerHTML='<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#9aa4b2"/></marker></defs>';for(const e of S.edges){const a=by(e.from),b=by(e.to);if(!a||!b)continue;const x1=100000+a.x+a.w/2,y1=100000+a.y+a.h/2,x2=100000+b.x+b.w/2,y2=100000+b.y+b.h/2,dx=Math.max(60,Math.abs(x2-x1)*.45),p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d',`M ${x1} ${y1} C ${x1+dx} ${y1}, ${x2-dx} ${y2}, ${x2} ${y2}`);p.setAttribute('fill','none');p.setAttribute('stroke','#9aa4b2');p.setAttribute('stroke-width','2');p.setAttribute('marker-end','url(#arrow)');ee.appendChild(p)}}
function inspector(){if(sel.size!==1){insp.classList.add('hidden');return}insp.classList.remove('hidden');const n=by([...sel][0]);if(!n)return;$('#inspectorType').textContent=`${icon(n.type)} ${n.type}`;$('#inspectorTitle').value=n.title||'';$('#inspectorContent').value=n.content||'';$('#inspectorRef').value=n.ref||'';$('#openRefBtn').disabled=!n.ref}
function wp(x,y){const r=v.getBoundingClientRect();return{x:(x-r.left-S.camera.x)/S.camera.zoom,y:(y-r.top-S.camera.y)/S.camera.zoom}}
function setTool(t){tool=t;linkSource=null;document.querySelectorAll('[data-tool]').forEach(b=>b.classList.toggle('active',b.dataset.tool===t));msg(t==='link'?'连线模式：依次点击两个节点':'选择模式')}function msg(m){toast.textContent=m;toast.classList.add('show');clearTimeout(msg.t);msg.t=setTimeout(()=>toast.classList.remove('show'),1500)}
v.addEventListener('pointerdown',e=>{const el=e.target.closest('.node');if(el){const id=el.dataset.id;if(tool==='link'){if(!linkSource){linkSource=id;sel.clear();sel.add(id);msg('选择目标节点');render()}else if(linkSource!==id){S.edges.push({id:uid('e'),from:linkSource,to:id});linkSource=null;save();render();msg('已连线')}return}if(!e.shiftKey&&!sel.has(id)){sel.clear();sel.add(id)}else if(e.shiftKey){sel.has(id)?sel.delete(id):sel.add(id)}render();const p=wp(e.clientX,e.clientY);drag={start:p,orig:[...sel].map(i=>{const n=by(i);return{id:i,x:n.x,y:n.y}})};el.setPointerCapture(e.pointerId);e.stopPropagation();return}if(tool!=='select')return;sel.clear();render();pan={x:e.clientX,y:e.clientY,cx:S.camera.x,cy:S.camera.y};v.classList.add('panning');v.setPointerCapture(e.pointerId)});
v.addEventListener('pointermove',e=>{if(drag){const p=wp(e.clientX,e.clientY),dx=p.x-drag.start.x,dy=p.y-drag.start.y;drag.orig.forEach(o=>{const n=by(o.id);n.x=o.x+dx;n.y=o.y+dy});render();return}if(pan){S.camera.x=pan.cx+e.clientX-pan.x;S.camera.y=pan.cy+e.clientY-pan.y;render()}});v.addEventListener('pointerup',()=>{if(drag||pan){drag=null;pan=null;v.classList.remove('panning');save()}});v.addEventListener('wheel',e=>{e.preventDefault();const r=v.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top,b={x:(mx-S.camera.x)/S.camera.zoom,y:(my-S.camera.y)/S.camera.zoom},z=Math.min(2.2,Math.max(.3,S.camera.zoom*(e.deltaY<0?1.1:.9)));S.camera.zoom=z;S.camera.x=mx-b.x*z;S.camera.y=my-b.y*z;render();save()},{passive:false});ne.addEventListener('dblclick',e=>{const el=e.target.closest('.node');if(!el)return;const n=by(el.dataset.id);if(n.type==='note'){const x=prompt('编辑 Note',n.content||'');if(x!==null){n.content=x;save();render()}}else if(n.type==='web'&&n.ref)window.open(n.ref,'_blank','noopener,noreferrer')});
document.querySelectorAll('[data-tool]').forEach(b=>b.addEventListener('click',()=>setTool(b.dataset.tool)));$('#addNote').addEventListener('click',()=>{const c=wp(innerWidth/2,innerHeight/2),id=uid();S.nodes.push(node(id,'note',c.x-150,c.y-70,300,120,'New Note','双击可编辑。'));sel.clear();sel.add(id);save();render()});$('#imageInput').addEventListener('change',async e=>{for(const f of [...e.target.files]){const data=await new Promise(res=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.readAsDataURL(f)}),c=wp(innerWidth/2,innerHeight/2),id=uid();S.nodes.push(node(id,'image',c.x-170+Math.random()*50,c.y-110+Math.random()*50,340,220,f.name,'',null,data));sel.clear();sel.add(id)}e.target.value='';save();render()});
function fit(){if(!S.nodes.length)return;let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;S.nodes.forEach(n=>{minX=Math.min(minX,n.x);minY=Math.min(minY,n.y);maxX=Math.max(maxX,n.x+n.w);maxY=Math.max(maxY,n.y+n.h)});const r=v.getBoundingClientRect(),p=80,z=Math.min(1.3,Math.max(.3,Math.min((r.width-p*2)/(maxX-minX),(r.height-p*2)/(maxY-minY))));S.camera.zoom=z;S.camera.x=(r.width-(maxX-minX)*z)/2-minX*z;S.camera.y=(r.height-(maxY-minY)*z)/2-minY*z;save();render()}
$('#fitBtn').onclick=fit;$('#resetBtn').onclick=()=>{if(confirm('重置为演示画布？')){S=demo();sel.clear();save();render();fit()}};$('#exportBtn').onclick=()=>{const b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='dsh-canvas-preview.json';a.click();URL.revokeObjectURL(a.href)};$('#importInput').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{S=JSON.parse(await f.text());sel.clear();save();render();fit()}catch{alert('JSON 无效')}e.target.value=''});$('#deleteBtn').onclick=()=>{if(sel.size!==1)return;const id=[...sel][0];S.nodes=S.nodes.filter(n=>n.id!==id);S.edges=S.edges.filter(e=>e.from!==id&&e.to!==id);sel.clear();save();render()};$('#openRefBtn').onclick=()=>{if(sel.size!==1)return;const n=by([...sel][0]);if(!n?.ref)return;/^https?:\/\//.test(n.ref)?window.open(n.ref,'_blank','noopener,noreferrer'):msg('Standalone Preview 无法打开 DSH 本地文件；canonical path 已保留')};['inspectorTitle','inspectorContent','inspectorRef'].forEach(id=>$('#'+id).addEventListener('input',()=>{if(sel.size!==1)return;const n=by([...sel][0]);n.title=$('#inspectorTitle').value;n.content=$('#inspectorContent').value;n.ref=$('#inspectorRef').value;save();render()}));
function ask(){const i=$('#promptInput'),q=i.value.trim();if(!q)return;const ctx=[...sel].map(by).filter(Boolean),base=ctx.length?ctx.reduce((a,n)=>({x:a.x+n.x+n.w,y:a.y+n.y}),{x:0,y:0}):{x:600,y:420},x=ctx.length?base.x/ctx.length+120:600,y=ctx.length?base.y/ctx.length+180:420,u=uid('u'),a=uid('a');S.nodes.push(node(u,'user',x,y,330,110,'Canvas Prompt',q));const sum=ctx.length?ctx.map(n=>`• ${n.title}`).join('\n'):'• 当前未选择对象';S.nodes.push(node(a,'agent',x+390,y,380,160,'Preview Agent（模拟）',`已收到你的请求：\n“${q}”\n\n当前上下文：\n${sum}\n\n真实 DSH 版本会在这里调用同一个 Session / Tools / Skills / MCP。`));S.edges.push({id:uid('e'),from:u,to:a});ctx.forEach(n=>S.edges.push({id:uid('e'),from:n.id,to:u}));sel.clear();sel.add(a);i.value='';save();render();msg('已生成模拟 Agent 回复')}
$('#askBtn').onclick=ask;$('#promptInput').addEventListener('keydown',e=>{if(e.key==='Enter')ask()});window.addEventListener('resize',render);render();setTimeout(fit,50)})();
</script>
</body></html>
